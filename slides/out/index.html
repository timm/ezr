<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tinyai slides</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { width: auto; height: auto; padding: 40px 56px 60px; }
  .deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .deck a { text-decoration: none; color: inherit; display: block; }
  .deck img { width: 100%; border: 1px solid var(--rule); border-radius: 8px;
               display: block; background: #fff; }
  .deck b { display: block; font-size: 17px; margin-top: 9px; }
  .deck span { font-size: 15px; color: var(--muted); }
</style></head>
<body>
<h1>tinyai slides</h1>
<p class="sub">5 slides &middot; edit slides/*.html, then <code>make slides</code></p>
<div class="deck">
  <a href="slide0.html"><img src="../../slide0.png" alt="Small Python, big baselines"><b>Small Python, big baselines</b><span>slide0</span></a>
  <a href="slide1.html"><img src="../../slide1.png" alt="Naive Bayes vs LightGBM"><b>Naive Bayes vs LightGBM</b><span>slide1</span></a>
  <a href="slide2.html"><img src="../../slide2.png" alt="Few labels? Rank with a weak learner"><b>Few labels? Rank with a weak learner</b><span>slide2</span></a>
  <a href="slide3.html"><img src="../../slide3.png" alt="Rare classes: read less, find more"><b>Rare classes: read less, find more</b><span>slide3</span></a>
  <a href="slide4.html"><img src="../../slide4.png" alt="How much code is that?"><b>How much code is that?</b><span>slide4</span></a>
</div>
</body></html>
