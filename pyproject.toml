[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ezr"
version = "0.9.9"
readme = "README.md"
description = "Explainable multi-objective optimization"
authors = [{name = "Tim Menzies", email = "timm@ieee.org"}]
license = {text = "MIT"}
requires-python = ">=3.12"   # PEP 695 `type X = ...`
dependencies = []

[project.scripts]
ezr = "ezr_eg:cli"
ezr-eg = "ezr_eg:cli"

[tool.setuptools]
py-modules = ["ezr", "ezr0", "ezr0_eg", "ezr_eg"]

[project.urls]
Changelog = "https://github.com/timm/ezr/blob/main/docs/CHANGELOG.md"
